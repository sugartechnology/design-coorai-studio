services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CRM_WEB_ORIGIN: ${NEXT_PUBLIC_CRM_WEB_ORIGIN:-http://localhost:3001}
    container_name: ${WEB_CONTAINER_NAME:-design_coorai_studio}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CRM_API_URL: ${CRM_API_URL:-http://host.docker.internal:9495/api}
      CRM_COMPANY_SLUG: ${CRM_COMPANY_SLUG:-istikbal}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-change-me-portal-session-secret}
      NEXT_PUBLIC_CRM_WEB_ORIGIN: ${NEXT_PUBLIC_CRM_WEB_ORIGIN:-http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
